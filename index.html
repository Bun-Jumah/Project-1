<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive, premium, and beautiful Hello World showcase utilizing modern web standards, spring physics animations, and custom theme layouts.">
  <title>Hello World Showcase</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Theme Definitions */
    :root {
      --bg-light: #f3f4f6;
      --bg-dark: #08090d;
      
      --card-bg-light: rgba(255, 255, 255, 0.45);
      --card-bg-dark: rgba(13, 16, 23, 0.45);
      
      --text-light: #1f2937;
      --text-dark: #f3f4f6;
      
      --text-secondary-light: #4b5563;
      --text-secondary-dark: #9ca3af;
      
      --border-light: rgba(255, 255, 255, 0.4);
      --border-dark: rgba(255, 255, 255, 0.08);
      
      --accent-light: #4f46e5;
      --accent-dark: #6366f1;
      
      --glow-light: rgba(79, 70, 229, 0.08);
      --glow-dark: rgba(99, 102, 241, 0.18);
      
      --shadow-light: rgba(0, 0, 0, 0.08);
      --shadow-dark: rgba(0, 0, 0, 0.4);

      /* Standard light-dark fallback setup */
      color-scheme: light dark;
      
      --bg: light-dark(var(--bg-light), var(--bg-dark));
      --card-bg: light-dark(var(--card-bg-light), var(--card-bg-dark));
      --text: light-dark(var(--text-light), var(--text-dark));
      --text-secondary: light-dark(var(--text-secondary-light), var(--text-secondary-dark));
      --border: light-dark(var(--border-light), var(--border-dark));
      --accent: light-dark(var(--accent-light), var(--accent-dark));
      --glow: light-dark(var(--glow-light), var(--glow-dark));
      --shadow: light-dark(var(--shadow-light), var(--shadow-dark));

      /* Spring Easing stops generated using physics-based curves */
      --spring-easing: linear(0, 0.016 0.5%, 0.06 1%, 0.226 2%, 1.116 5.4%, 1.375 6.6%, 1.527 7.7%, 1.565 8.2%, 1.585 8.8%, 1.581 9.3%, 1.559 9.8%, 1.458 10.9%, 0.937 14.3%, 0.784 15.5%, 0.693 16.6%, 0.67 17.1%, 0.657 17.7%, 0.671 18.7%, 0.729 19.8%, 1.042 23.3%, 1.13 24.5%, 1.182 25.6%, 1.201 26.7%, 1.192 27.7%, 1.156 28.8%, 0.977 32.2%, 0.925 33.4%, 0.894 34.5%, 0.882 35.6%, 0.887 36.6%, 0.907 37.7%, 1.045 42.4%, 1.069 44.5%, 1.059 46.3%, 0.979 50.9%, 0.96 53.4%, 0.966 55.3%, 1.013 59.9%, 1.024 62.3%, 0.986 71.2%, 1.008 79.9%, 0.995 88.9%, 1);
    }

    /* Override variables if data-theme attribute is set by toggle */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: var(--bg-light);
      --card-bg: var(--card-bg-light);
      --text: var(--text-light);
      --text-secondary: var(--text-secondary-light);
      --border: var(--border-light);
      --accent: var(--accent-light);
      --glow: var(--glow-light);
      --shadow: var(--shadow-light);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: var(--bg-dark);
      --card-bg: var(--card-bg-dark);
      --text: var(--text-dark);
      --text-secondary: var(--text-secondary-dark);
      --border: var(--border-dark);
      --accent: var(--accent-dark);
      --glow: var(--glow-dark);
      --shadow: var(--shadow-dark);
    }

    /* Core Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Interactive Mesh Grid Backdrop */
    .mesh-gradient {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--glow) 0%, transparent 60%),
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.06) 0%, transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 35%);
      opacity: 1;
      transition: background-image 0.1s ease;
    }

    /* Canvas overlay for particle burst effects */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Header controls */
    header {
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 3;
    }

    .nav-bar {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 4;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.3s ease, transform 0.3s var(--spring-easing), background-color 0.3s ease;
      padding: 0.4rem 1rem;
      border-radius: 20px;
    }

    .nav-link:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .nav-link.active {
      color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 12px var(--shadow);
      transition: scale 0.5s var(--spring-easing), border-color 0.3s ease, background-color 0.3s ease;
    }

    .theme-toggle:hover {
      scale: 1.1;
      border-color: var(--accent);
    }

    .theme-toggle:active {
      scale: 0.95;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--text);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.5s var(--spring-easing), stroke 0.3s ease;
    }

    .theme-toggle:hover svg {
      stroke: var(--accent);
      transform: rotate(15deg);
    }

    /* Main Container & Card */
    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 2rem;
      z-index: 2;
    }

    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
    }

    /* Card glow shadow */
    .card-wrapper::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      background: linear-gradient(135deg, var(--accent), #d946ef);
      border-radius: 28px;
      z-index: -1;
      opacity: 0.2;
      filter: blur(20px);
      transition: opacity 0.5s ease;
    }

    .card-wrapper:hover::before {
      opacity: 0.45;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      box-shadow: 0 20px 40px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.8s var(--spring-easing), border-color 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.015);
      border-color: rgba(99, 102, 241, 0.4);
    }

    /* Microbadge */
    .badge {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--accent);
      padding: 0.35rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      display: inline-block;
      animation: pulse 3s infinite ease-in-out;
    }

    /* Headings Layout Optimization */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 1rem;
      text-wrap: balance; /* Modern text legibility guidance style */
      background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.4s var(--spring-easing), opacity 0.2s ease;
      user-select: none;
    }

    h1.switching {
      transform: scale(0.92);
      opacity: 0;
    }

    /* Body Text Legibility Optimization */
    p.description {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 440px;
      text-wrap: pretty; /* Modern text legibility guidance style */
    }

    /* Button and Interactive Elements */
    .action-button {
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      padding: 1rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: scale 0.5s var(--spring-easing), box-shadow 0.3s ease;
    }

    .action-button:hover {
      scale: 1.06;
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5);
    }

    .action-button:active {
      scale: 0.96;
    }

    /* Language display badge */
    .lang-indicator {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
    }

    /* Footer styling */
    footer {
      width: 100%;
      padding: 2rem;
      text-align: center;
      z-index: 2;
    }

    footer p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      position: relative;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    footer a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 1px;
      bottom: -2px;
      left: 0;
      background-color: var(--accent);
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease-out;
    }

    footer a:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% {
        opacity: 0.9;
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.15);
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 0 8px rgba(99, 102, 241, 0);
      }
    }

    /* Respect accessibility motion reduction preferences */
    @media (prefers-reduced-motion: reduce) {
      .card, .theme-toggle, .action-button, h1, .theme-toggle svg {
        transition: none !important;
        animation: none !important;
        scale: 1 !important;
        transform: none !important;
      }
      
      .mesh-gradient {
        background-image: radial-gradient(circle at 50% 50%, var(--glow) 0%, transparent 60%);
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Backdrop Elements -->
  <div class="mesh-gradient" id="bg-glow" aria-hidden="true"></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- Header Section with Theme Toggle and Navigation -->
  <header>
    <nav class="nav-bar" aria-label="Main Navigation">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>
    <button class="theme-toggle" id="theme-button" aria-label="Toggle light and dark mode">
      <!-- SVG icons nested. System default renders correct one via stroke color or custom show/hide -->
      <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <!-- Sun path (will change dynamically to moon) -->
        <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
      </svg>
    </button>
  </header>

  <!-- Main Showcase content -->
  <main>
    <div class="card-wrapper">
      <section class="card">
        <span class="badge">Greeting App</span>
        <h1 id="greeting-title" class="pretty-text">Hello, World!</h1>
        <p class="description">
          A beautifully designed display built with pure, semantic HTML5, high-performance interactive canvases, and physics-based spring easing.
        </p>
        
        <button class="action-button" id="greeting-btn">
          <span>Say Hello</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/>
          </svg>
        </button>

        <div class="lang-indicator" id="lang-name" aria-live="polite">English</div>
      </section>
    </div>
  </main>

  <!-- Footer Info -->
  <footer>
    <p>Crafted with premium UI styling &bull; <a href="https://github.com" target="_blank" rel="noopener">Learn More</a></p>
  </footer>

  <script>
    // ----------------------------------------------------
    // 1. Theme Manager (Light / Dark Mode Custom Override)
    // ----------------------------------------------------
    const themeButton = document.getElementById('theme-button');
    const themeIcon = document.getElementById('theme-icon');
    const rootEl = document.documentElement;

    // SVG paths for sun and moon
    const sunPath = "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z";
    const moonPath = "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z";

    // Set initial icon path matching the resolved theme
    function updateThemeIcon(isDark) {
      themeIcon.querySelector('path').setAttribute('d', isDark ? moonPath : sunPath);
    }

    // Detect browser/system preferred color scheme
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    
    // Initialize theme settings
    let currentTheme = localStorage.getItem('theme');
    if (!currentTheme) {
      currentTheme = mediaQuery.matches ? 'dark' : 'light';
    }
    
    rootEl.setAttribute('data-theme', currentTheme);
    updateThemeIcon(currentTheme === 'dark');

    themeButton.addEventListener('click', (e) => {
      const nextTheme = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      rootEl.setAttribute('data-theme', nextTheme);
      localStorage.setItem('theme', nextTheme);
      updateThemeIcon(nextTheme === 'dark');
      
      // Trigger subtle particle burst on theme change
      createBurst(e.clientX, e.clientY, 15);
    });

    // Sync if user updates OS preferences while page is open
    mediaQuery.addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        const nextTheme = e.matches ? 'dark' : 'light';
        rootEl.setAttribute('data-theme', nextTheme);
        updateThemeIcon(nextTheme === 'dark');
      }
    });

    // ----------------------------------------------------
    // 2. Interactive Backdrop Mouse-Tracking
    // ----------------------------------------------------
    const bgGlow = document.getElementById('bg-glow');
    let targetX = 50, targetY = 50;
    let currentX = 50, currentY = 50;

    window.addEventListener('mousemove', (e) => {
      // Convert absolute pixels to percentage positions
      targetX = (e.clientX / window.innerWidth) * 100;
      targetY = (e.clientY / window.innerHeight) * 100;
    });

    // Smooth lerp (linear interpolation) for hover glow tracker
    function updateGlowPosition() {
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;
      
      bgGlow.style.setProperty('--mouse-x', `${currentX}%`);
      bgGlow.style.setProperty('--mouse-y', `${currentY}%`);
      
      requestAnimationFrame(updateGlowPosition);
    }
    updateGlowPosition();

    // ----------------------------------------------------
    // 3. Multilingual "Hello World!" Data & Switcher
    // ----------------------------------------------------
    const languages = [
      { text: "Hello, World!", langName: "English" },
      { text: "¡Hola, Mundo!", langName: "Spanish" },
      { text: "Bonjour, le Monde!", langName: "French" },
      { text: "こんにちは、世界！", langName: "Japanese" },
      { text: "Mo kí gbogbo Ayé!", langName: "Yoruba" },
      { text: "Hallo, Welt!", langName: "German" },
      { text: "Ciao, Mondo!", langName: "Italian" },
      { text: "你好，世界！", langName: "Mandarin" },
      { text: "नमस्ते दुनिया!", langName: "Hindi" },
      { text: "أهلاً بالعالم!", langName: "Arabic" }
    ];

    let currentIndex = 0;
    const titleEl = document.getElementById('greeting-title');
    const langEl = document.getElementById('lang-name');
    const actionBtn = document.getElementById('greeting-btn');

    actionBtn.addEventListener('click', (e) => {
      // Increment index
      currentIndex = (currentIndex + 1) % languages.length;
      
      // Animate text change gracefully
      titleEl.classList.add('switching');
      
      // Update text and language info after half transition
      setTimeout(() => {
        titleEl.textContent = languages[currentIndex].text;
        langEl.textContent = languages[currentIndex].langName;
        titleEl.classList.remove('switching');
      }, 200);

      // Trigger interactive canvas particles on button click position
      const rect = actionBtn.getBoundingClientRect();
      const burstX = rect.left + rect.width / 2;
      const burstY = rect.top + rect.height / 2;
      createBurst(burstX, burstY, 35);
    });

    // ----------------------------------------------------
    // 4. Interactive Canvas Particle Burst Engine
    // ----------------------------------------------------
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    
    let particles = [];

    // Resize canvas to cover viewport
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        // Generate random physics properties
        const angle = Math.random() * Math.PI * 2;
        const velocity = 2 + Math.random() * 6;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity - 1; // Slight upward bias
        this.radius = 2 + Math.random() * 4;
        this.color = getThemeAccentColor();
        this.alpha = 1;
        this.decay = 0.015 + Math.random() * 0.02;
        this.gravity = 0.15;
      }

      update() {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Dynamically retrieve CSS accent color for canvas particles matching active mode
    function getThemeAccentColor() {
      const theme = rootEl.getAttribute('data-theme');
      if (theme === 'dark') {
        return '#6366f1';
      }
      return '#4f46e5';
    }

    // Instantiates a cluster of particles at coordinates
    function createBurst(x, y, count) {
      // Respect prefers-reduced-motion configuration
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y));
      }
    }

    // Particle Animation Loop
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Update and draw existing particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw();
        }
      }
      
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Subtle passive floating particles around card on mouse movement
    window.addEventListener('mousemove', (e) => {
      if (Math.random() < 0.08) {
        createBurst(e.clientX, e.clientY, 1);
      }
    });
  </script>
</body>
</html>
